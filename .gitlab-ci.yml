default:
  tags:
    - docker

stages:
  - build
  - push
  - update-gitops

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  HARBOR_REGISTRY: "harbor.thsown.me"
  HARBOR_PROJECT: "studyforge"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

build-images:
  stage: build
  image: docker:27-cli
  script:
    - docker info
    - docker build --file infra/docker/backend.Dockerfile --target quality --tag "studyforge-quality:${CI_PIPELINE_ID}" .
    - docker run --rm "studyforge-quality:${CI_PIPELINE_ID}"
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] && [ -z "$CI_COMMIT_TAG" ]; then
        echo "Quality gate passed; image build is reserved for the default branch and tags."
        exit 0
      fi
    - docker build --pull --file infra/docker/frontend.Dockerfile --tag "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}" .
    - docker build --pull --file infra/docker/backend.Dockerfile --tag "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}" .
  after_script:
    - docker image rm "studyforge-quality:${CI_PIPELINE_ID}" || true

push-images:
  stage: push
  image: docker:27-cli
  before_script:
    - test -n "$HARBOR_USER" || (echo "HARBOR_USER is required" && exit 1)
    - test -n "$HARBOR_PASSWORD" || (echo "HARBOR_PASSWORD is required" && exit 1)
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
  script:
    - docker image inspect "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}"
    - docker image inspect "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}"
    - docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}"
    - docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}"
  after_script:
    - docker logout "$HARBOR_REGISTRY" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}" || true
    - rm -rf "$DOCKER_CONFIG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"
