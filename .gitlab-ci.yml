default:
  tags:
    - docker

stages:
  - validate
  - publish
  - verify
  - update-gitops

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  APP_CONTAINER_USER: "1000:1000"
  HARBOR_REGISTRY: "harbor.thsown.me"
  HARBOR_PROJECT: "studyforge-app"
  GITOPS_BRANCH: "main"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

validate-source:
  stage: validate
  script:
    - docker info
    - docker build --file infra/docker/backend.Dockerfile --target quality --tag "studyforge-quality:${CI_PIPELINE_ID}" .
    - docker run --rm "studyforge-quality:${CI_PIPELINE_ID}"
  after_script:
    - docker image rm "studyforge-quality:${CI_PIPELINE_ID}" || true

.publish-image:
  stage: publish
  before_script:
    - test -n "$HARBOR_USER" || (echo "HARBOR_USER is required" && exit 1)
    - test -n "$HARBOR_PASS" || (echo "HARBOR_PASS is required" && exit 1)
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$HARBOR_PASS" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
  script:
    - IMAGE_REF="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHA}"
    - docker build --pull --file "$DOCKERFILE" --tag "$IMAGE_REF" .
    - docker push "$IMAGE_REF"
  after_script:
    - docker logout "$HARBOR_REGISTRY" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHA}" || true
    - rm -rf "$DOCKER_CONFIG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"

publish-frontend:
  extends: .publish-image
  variables:
    IMAGE_NAME: frontend
    DOCKERFILE: infra/docker/frontend.Dockerfile

publish-backend:
  extends: .publish-image
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: infra/docker/backend.Dockerfile

verify-images:
  stage: verify
  needs:
    - publish-frontend
    - publish-backend
  before_script:
    - test -n "$HARBOR_USER" || (echo "HARBOR_USER is required" && exit 1)
    - test -n "$HARBOR_PASS" || (echo "HARBOR_PASS is required" && exit 1)
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$HARBOR_PASS" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
  script:
    - FRONTEND_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}"
    - BACKEND_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}"
    - docker pull "$FRONTEND_IMAGE"
    - docker pull "$BACKEND_IMAGE"
    - test "$(docker image inspect --format '{{.Config.User}}' "$FRONTEND_IMAGE")" = "$APP_CONTAINER_USER"
    - test "$(docker image inspect --format '{{.Config.User}}' "$BACKEND_IMAGE")" = "$APP_CONTAINER_USER"
    - docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$FRONTEND_IMAGE" | grep -q CMD-SHELL
    - docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$BACKEND_IMAGE" | grep -q CMD-SHELL
    - VERIFY_NETWORK="studyforge-ci-${CI_PIPELINE_ID}"
    - DB_CONTAINER="studyforge-ci-db-${CI_PIPELINE_ID}"
    - BACKEND_CONTAINER="studyforge-ci-backend-${CI_PIPELINE_ID}"
    - FRONTEND_CONTAINER="studyforge-ci-frontend-${CI_PIPELINE_ID}"
    - CI_DB_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"
    - docker network create "$VERIFY_NETWORK"
    - docker run --detach --name "$DB_CONTAINER" --network "$VERIFY_NETWORK" --env POSTGRES_USER=studyforge --env POSTGRES_DB=studyforge --env POSTGRES_PASSWORD="$CI_DB_PASSWORD" postgres:17.11-alpine3.23
    - |
      for attempt in $(seq 1 30); do
        if docker exec "$DB_CONTAINER" pg_isready --username studyforge --dbname studyforge >/dev/null 2>&1; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          docker logs "$DB_CONTAINER"
          exit 1
        fi
        sleep 2
      done
    - docker run --rm --network "$VERIFY_NETWORK" --env PGHOST="$DB_CONTAINER" --env PGPORT=5432 --env PGUSER=studyforge --env PGPASSWORD="$CI_DB_PASSWORD" --env PGDATABASE=studyforge "$BACKEND_IMAGE" node scripts/migrate-postgres.mjs
    - docker run --detach --name "$BACKEND_CONTAINER" --network "$VERIFY_NETWORK" --env NODE_ENV=test --env HOST=0.0.0.0 --env API_PORT=3001 --env PGHOST="$DB_CONTAINER" --env PGPORT=5432 --env PGUSER=studyforge --env PGPASSWORD="$CI_DB_PASSWORD" --env PGDATABASE=studyforge --env ALLOWED_ORIGINS="http://${FRONTEND_CONTAINER}:3000" --env SECURE_COOKIES=false "$BACKEND_IMAGE"
    - docker run --detach --name "$FRONTEND_CONTAINER" --network "$VERIFY_NETWORK" --env FE_HOST=0.0.0.0 --env FE_PORT=3000 --env API_PROXY_TARGET="http://${BACKEND_CONTAINER}:3001" --env PUBLIC_API_BASE_URL= "$FRONTEND_IMAGE"
    - |
      for container in "$BACKEND_CONTAINER" "$FRONTEND_CONTAINER"; do
        for attempt in $(seq 1 30); do
          status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
          if [ "$status" = "healthy" ]; then
            break
          fi
          if [ "$status" = "unhealthy" ] || [ "$attempt" -eq 30 ]; then
            docker logs "$container"
            exit 1
          fi
          sleep 2
        done
      done
    - docker run --rm --network "$VERIFY_NETWORK" --env SMOKE_TEST_ENABLED=true --env SMOKE_BASE_URL="http://${FRONTEND_CONTAINER}:3000" --env PGHOST="$DB_CONTAINER" --env PGPORT=5432 --env PGUSER=studyforge --env PGPASSWORD="$CI_DB_PASSWORD" --env PGDATABASE=studyforge "$BACKEND_IMAGE" node tests/smoke/compose-smoke.mjs
  after_script:
    - docker rm --force "studyforge-ci-frontend-${CI_PIPELINE_ID}" "studyforge-ci-backend-${CI_PIPELINE_ID}" "studyforge-ci-db-${CI_PIPELINE_ID}" || true
    - docker network rm "studyforge-ci-${CI_PIPELINE_ID}" || true
    - docker logout "$HARBOR_REGISTRY" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend:${CI_COMMIT_SHA}" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend:${CI_COMMIT_SHA}" || true
    - rm -rf "$DOCKER_CONFIG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"

update-gitops:
  stage: update-gitops
  image: alpine:3.20
  needs:
    - verify-images
  before_script:
    - apk add --no-cache git yq-go
    - test -n "$GITOPS_REPO" || (echo "GITOPS_REPO is required" && exit 1)
    - test -n "$GITOPS_TOKEN" || (echo "GITOPS_TOKEN is required" && exit 1)
    - |
      case "$GITOPS_REPO" in
        http://*|https://*) GITOPS_URL="$GITOPS_REPO" ;;
        *) GITOPS_URL="http://${GITOPS_REPO}" ;;
      esac
      GITOPS_HOST="$(printf '%s' "$GITOPS_URL" | sed -E 's#https?://([^/]+)/.*#\1#')"
      printf 'machine %s\nlogin gitlab-ci-token\npassword %s\n' "$GITOPS_HOST" "$GITOPS_TOKEN" > "$HOME/.netrc"
      chmod 600 "$HOME/.netrc"
      export GITOPS_URL
  script:
    - git clone "$GITOPS_URL" studyforge-gitops
    - cd studyforge-gitops
    - test -f k8s/values.yaml || (echo "k8s/values.yaml was not found in studyforge-gitops" && exit 1)
    - export FRONTEND_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend"
    - export BACKEND_REPOSITORY="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend"
    - yq -i '.frontend.image.repository = strenv(FRONTEND_REPOSITORY) | .frontend.image.tag = strenv(CI_COMMIT_SHA) | .backend.image.repository = strenv(BACKEND_REPOSITORY) | .backend.image.tag = strenv(CI_COMMIT_SHA)' k8s/values.yaml
    - git config user.email "ci@thsown.me"
    - git config user.name "studyforge-ci"
    - git add k8s/values.yaml
    - |
      if git diff --cached --quiet; then
        echo "GitOps values already reference ${CI_COMMIT_SHA}."
        exit 0
      fi
    - 'git commit -m "chore(images): update StudyForge to ${CI_COMMIT_SHORT_SHA} [skip ci]"'
    - git push origin "HEAD:${GITOPS_BRANCH}"
  after_script:
    - rm -f "$HOME/.netrc"
    - rm -rf studyforge-gitops
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
