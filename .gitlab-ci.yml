default:
  tags:
    - docker

stages:
  - validate
  - publish

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  HARBOR_REGISTRY: "harbor.thsown.me"
  HARBOR_PROJECT: "studyforge"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

quality:
  stage: validate
  image: docker:27-cli
  script:
    - docker info
    - docker build --file infra/docker/backend.Dockerfile --target quality --tag "studyforge-quality:${CI_COMMIT_SHA}" .
    - docker run --rm "studyforge-quality:${CI_COMMIT_SHA}"
  after_script:
    - docker image rm "studyforge-quality:${CI_COMMIT_SHA}" || true

.publish-image:
  stage: publish
  image: docker:27-cli
  before_script:
    - test -n "$HARBOR_USER" || (echo "HARBOR_USER is required" && exit 1)
    - test -n "$HARBOR_PASSWORD" || (echo "HARBOR_PASSWORD is required" && exit 1)
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
  script:
    - IMAGE_REF="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHA}"
    - docker build --pull --file "$DOCKERFILE" --tag "$IMAGE_REF" .
    - docker push "$IMAGE_REF"
  after_script:
    - docker logout "$HARBOR_REGISTRY" || true
    - docker image rm "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${CI_COMMIT_SHA}" || true
    - rm -rf "$DOCKER_CONFIG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_TAG"

publish-frontend:
  extends: .publish-image
  variables:
    IMAGE_NAME: frontend
    DOCKERFILE: infra/docker/frontend.Dockerfile

publish-backend:
  extends: .publish-image
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: infra/docker/backend.Dockerfile
