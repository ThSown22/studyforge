apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studyforge-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@gitlab.thsown.com:thsown_group/studyforge-gitops.git
    targetRevision: main
    path: k8s
    helm:
      releaseName: studyforge
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: studyforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
