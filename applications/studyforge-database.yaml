apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studyforge-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: git@gitlab.thsown.com:thsown_group/studyforge-gitops.git
    targetRevision: main
    path: infrastructure/postgresql
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: studyforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
