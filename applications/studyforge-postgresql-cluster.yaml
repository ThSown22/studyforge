# Reconciles the StudyForge CloudNativePG Cluster declared under infrastructure/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studyforge-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: studyforge
  source:
    repoURL: git@gitlab.thsown.com:thsown_group/studyforge-gitops.git
    targetRevision: main
    path: infrastructure/postgresql
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: studyforge
  syncPolicy:
    automated:
      # Database deletion is an explicit data operation, never an automatic prune.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Cluster CRD is installed by the preceding CloudNativePG application.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
