apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studyforge-postgres
  namespace: studyforge
  labels:
    app.kubernetes.io/name: studyforge-postgres
    app.kubernetes.io/part-of: studyforge
  annotations:
    # The database must never be removed by an automated Argo CD prune.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11

  bootstrap:
    initdb:
      database: studyforge
      owner: studyforge
      dataChecksums: true

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  monitoring:
    enablePodMonitor: false
