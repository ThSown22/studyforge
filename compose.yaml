# Cấu hình V1/SQLite để tham khảo; chưa triển khai PostgreSQL cho StudyForge V2.
services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      API_PORT: ${STUDYFORGE_API_PORT:-3001}
      DATABASE_PATH: /app/data/studyforge.sqlite
      FRONTEND_DIR: /app/empty-public
      ALLOWED_ORIGINS: ${STUDYFORGE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECURE_COOKIES: "false"
      SESSION_TTL_SECONDS: ${STUDYFORGE_SESSION_TTL_SECONDS:-604800}
    volumes:
      - studyforge-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      FE_HOST: 0.0.0.0
      FE_PORT: ${STUDYFORGE_FE_PORT:-3000}
      API_PROXY_TARGET: http://backend:${STUDYFORGE_API_PORT:-3001}
      PUBLIC_API_BASE_URL: ""
    ports:
      - "${STUDYFORGE_HOST_FE_PORT:-3000}:${STUDYFORGE_FE_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  studyforge-data:
