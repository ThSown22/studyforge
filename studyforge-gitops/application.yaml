apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studyforge-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitlab.thsown.com:thsown_group/studyforge-gitops.git
    targetRevision: main
    path: applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
